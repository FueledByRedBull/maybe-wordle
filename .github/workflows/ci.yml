name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Identity tests hash their executable; full embedded DWARF exhausts tiny test budgets.
      # Retain file/line backtraces without changing assertions, overflow checks or deadlines.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Format
        if: runner.os == 'Windows'
        run: cargo fmt --check
      - name: Clippy
        if: runner.os == 'Windows'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Build CLI and GUI without opening a window
        run: cargo build --locked --bins
      - name: CLI smoke
        run: cargo run --locked --bin maybe-wordle -- --help
      - name: Check public evidence redaction
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/redact_public_evidence.ps1 -Check
      - name: Verify published rolling evidence
        if: runner.os == 'Windows'
        run: >-
          cargo run --locked --bin maybe-wordle -- rolling-evidence-docs
          --comparison docs/evidence/september-audit-rolling-public-v1.json
          --markdown-output docs/generated/rolling-evidence.md --readme README.md
      - name: Verify current predictive timing-screen evidence
        if: runner.os == 'Windows'
        run: >-
          cargo run --locked --bin maybe-wordle -- benchmark-evidence-docs
          --evidence docs/evidence/september-audit-timing-screen-public-v1.json
          --markdown-output docs/generated/september-audit-timing-screen-v1.md
          --readme README.md
